name: 'Gungi AI Development'
description: 'AI-driven development automation. Executes phasechains to implement, review, and deliver code changes.'
author: 'Gungi'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  execution-id:
    description: 'Gungi execution ID (created by Gungi API on webhook)'
    required: true
  github-token:
    description: 'GitHub token for repository operations (checkout, branch creation, PR)'
    required: true
  ghcr-token:
    description: 'Token for pulling private Docker image from ghcr.io'
    required: true
  gungi-api-url:
    description: 'Gungi API URL'
    required: false
    default: 'https://api.gungi.dev'

runs:
  using: 'composite'
  steps:
    # 1. Private Docker イメージの認証
    - name: Login to GHCR
      shell: bash
      run: echo "${{ inputs.ghcr-token }}" | docker login ghcr.io -u gungi --password-stdin

    # 2. Docker イメージを事前に取得
    - name: Pull Gungi Runner
      shell: bash
      run: docker pull ghcr.io/symon-brain/gungi-runner:latest

    # 3. Gungi Docker Runner を実行
    #    checkout・ブランチ作成はDocker Runner内部で実施（Config APIから情報取得）
    - name: Run Gungi phasechain
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -e EXECUTION_ID="${{ inputs.execution-id }}" \
          -e GUNGI_API_URL="${{ inputs.gungi-api-url }}" \
          -e GUNGI_WORKSPACE=/workspace \
          -e GITHUB_TOKEN="${{ inputs.github-token }}" \
          -e GUNGI_PROVIDER=claude \
          ghcr.io/symon-brain/gungi-runner:latest

    # 4. 結果サマリーを出力
    - name: Output summary
      if: always()
      shell: bash
      run: |
        echo "## Gungi Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Execution ID**: ${{ inputs.execution-id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
