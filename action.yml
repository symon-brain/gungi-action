name: 'Gungi AI Development'
description: 'AI-driven development automation. Executes chains to implement, review, and deliver code changes.'
author: 'Gungi'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  auth-token:
    description: 'One-time authentication token (created by Gungi API on webhook)'
    required: true
  github-token:
    description: 'GitHub token for repository operations (checkout, branch creation, PR)'
    required: true

runs:
  using: 'composite'
  steps:
    # 1. リポジトリをチェックアウト（Docker Runner内で /workspace/repo として使用）
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        path: repo

    # 2. Mask auth token to prevent exposure in logs
    - name: Mask auth token
      shell: bash
      run: echo "::add-mask::${{ inputs.auth-token }}"

    # 3. Private Docker イメージの認証（GHCR tokenをAPIから取得）
    - name: Get GHCR token
      id: ghcr
      shell: bash
      run: |
        GHCR_TOKEN=$(curl -s -f -X GET "https://api.gungi-ai.com/api/runner/ghcr-token" -H "Authorization: Bearer ${{ inputs.auth-token }}" | jq -r '.token')
        if [ -z "$GHCR_TOKEN" ] || [ "$GHCR_TOKEN" = "null" ]; then
          echo "Failed to retrieve GHCR token"
          exit 1
        fi
        echo "::add-mask::$GHCR_TOKEN"
        echo "token=$GHCR_TOKEN" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      shell: bash
      run: echo "${{ steps.ghcr.outputs.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # 4. Docker イメージを取得
    - name: Pull Gungi Runner
      shell: bash
      run: docker pull ghcr.io/symon-brain/gungi-runner:latest

    # 5. Dockerイメージのdigestを取得（実行メタデータに保存用）
    - name: Get image digest
      id: digest
      shell: bash
      run: echo "value=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/symon-brain/gungi-runner:latest)" >> $GITHUB_OUTPUT

    # 6. GitHub トークンをマスク（ログ露出防止）
    - name: Mask sensitive tokens
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.github-token }}"

    # 7. Gungi Docker Runner を実行
    # GUNGI_WORKSPACE=/workspace: checkout path: repo によりリポジトリは /workspace/repo に配置。
    # GUNGI_WORKSPACEはその親ディレクトリを指す（.takt/ 等の出力先として使用）。
    - name: Run Gungi chain
      shell: bash
      run: |
        # Ensure cleanup happens even on failure
        trap 'rm -f /tmp/secrets/github_token' EXIT

        # Create tmpfs directory for secrets
        mkdir -p /tmp/secrets
        echo "${{ inputs.github-token }}" > /tmp/secrets/github_token
        chmod 600 /tmp/secrets/github_token

        docker run --rm \
          --log-driver none \
          -v "${{ github.workspace }}:/workspace" \
          -v /tmp/secrets:/tmp/secrets:ro \
          -e AUTH_TOKEN="${{ inputs.auth-token }}" \
          -e GUNGI_API_URL="https://api.gungi-ai.com" \
          -e GUNGI_WORKSPACE=/workspace \
          -e GITHUB_TOKEN_FILE=/tmp/secrets/github_token \
          -e GUNGI_PROVIDER=claude \
          -e GUNGI_IMAGE_DIGEST="${{ steps.digest.outputs.value }}" \
          -e GITHUB_RUN_ID="${{ github.run_id }}" \
          ghcr.io/symon-brain/gungi-runner:latest

    # 8. 結果サマリーを出力
    - name: Output summary
      if: always()
      shell: bash
      run: |
        echo "## Gungi Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
