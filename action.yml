name: 'Gungi AI Development'
description: 'AI-driven development automation. Executes phasechains to implement, review, and deliver code changes.'
author: 'Gungi'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  execution-id:
    description: 'Gungi execution ID (created by Gungi API on webhook)'
    required: true
  github-token:
    description: 'GitHub token for repository operations (checkout, branch creation, PR)'
    required: true
  gungi-api-url:
    description: 'Gungi API URL'
    required: true

runs:
  using: 'composite'
  steps:
    # 0. リポジトリを workspace/repo/ にチェックアウト
    #    Docker Runner は /workspace/repo/ を作業ディレクトリとして使用し、
    #    /workspace/.takt/ にログ・レポートを出力する（PRに含まれない）
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        path: repo

    # 1. Gungi API から GHCR トークンを取得
    #    有効な execution_id + active な installation であればトークンが返る
    - name: Get GHCR token from Gungi API
      id: ghcr-auth
      shell: bash
      run: |
        RESPONSE=$(curl -sf "${{ inputs.gungi-api-url }}/api/runner/ghcr-token?execution_id=${{ inputs.execution-id }}")
        if [ $? -ne 0 ]; then
          echo "::error::Failed to get GHCR token from Gungi API"
          exit 1
        fi
        TOKEN=$(echo "$RESPONSE" | jq -r '.token')
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "::error::GHCR token is empty"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    # 2. Private Docker イメージの認証
    - name: Login to GHCR
      shell: bash
      run: echo "${{ steps.ghcr-auth.outputs.token }}" | docker login ghcr.io -u gungi --password-stdin

    # 3. Docker イメージを事前に取得
    - name: Pull Gungi Runner
      shell: bash
      run: docker pull ghcr.io/symon-brain/gungi-runner:latest

    # 4. Gungi Docker Runner を実行
    #    checkout・ブランチ作成はDocker Runner内部で実施（Config APIから情報取得）
    - name: Run Gungi phasechain
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -e EXECUTION_ID="${{ inputs.execution-id }}" \
          -e GUNGI_API_URL="${{ inputs.gungi-api-url }}" \
          -e GUNGI_WORKSPACE=/workspace \
          -e GITHUB_TOKEN="${{ inputs.github-token }}" \
          -e GUNGI_PROVIDER=claude \
          ghcr.io/symon-brain/gungi-runner:latest

    # 5. 結果サマリーを出力
    - name: Output summary
      if: always()
      shell: bash
      run: |
        echo "## Gungi Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Execution ID**: ${{ inputs.execution-id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
