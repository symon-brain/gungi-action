name: 'Gungi AI Development'
description: 'AI-driven development automation. Executes chains to implement, review, and deliver code changes.'
author: 'Gungi'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  auth-token:
    description: 'One-time authentication token (created by Gungi API on webhook)'
    required: true
  github-token:
    description: 'GitHub token for repository operations (checkout, branch creation, PR)'
    required: true
  resume-ref:
    description: 'Checkpoint ref for resume (optional)'
    required: false

runs:
  using: 'composite'
  steps:
    # 1. リポジトリをチェックアウト（Docker Runner内で /workspace/repo として使用）
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        path: repo

    # 2. Mask auth token to prevent exposure in logs
    - name: Mask auth token
      shell: bash
      run: echo "::add-mask::${{ inputs.auth-token }}"

    # 3. Private Docker イメージの認証（GHCR tokenをAPIから取得）
    - name: Get GHCR token
      id: ghcr
      shell: bash
      run: |
        GHCR_TOKEN=$(curl -s -f -X GET "https://api.gungi-ai.com/api/runner/ghcr-token" -H "Authorization: Bearer ${{ inputs.auth-token }}" | jq -r '.token')
        if [ -z "$GHCR_TOKEN" ] || [ "$GHCR_TOKEN" = "null" ]; then
          echo "Failed to retrieve GHCR token"
          exit 1
        fi
        echo "::add-mask::$GHCR_TOKEN"
        echo "token=$GHCR_TOKEN" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      shell: bash
      run: echo "${{ steps.ghcr.outputs.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # 4. Docker イメージを取得
    - name: Pull Gungi Runner
      shell: bash
      run: docker pull ghcr.io/symon-brain/gungi-runner:latest

    # 5. Dockerイメージのdigestを取得（実行メタデータに保存用）
    - name: Get image digest
      id: digest
      shell: bash
      run: echo "value=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/symon-brain/gungi-runner:latest)" >> $GITHUB_OUTPUT

    # 6. GitHub トークンをマスク（ログ露出防止）
    - name: Mask sensitive tokens
      shell: bash
      run: |
        echo "::add-mask::${{ inputs.github-token }}"

    # 7a-7d. Gungi devcontainer ステップ（検出→CLI導入→ビルド→実行）
    - name: Check for Gungi devcontainer config
      id: devcontainer-check
      shell: bash
      run: |
        if [ -f "${{ github.workspace }}/repo/.gungi/devcontainer/devcontainer.json" ]; then
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Fail if Gungi devcontainer not found
      if: steps.devcontainer-check.outputs.found != 'true'
      shell: bash
      run: |
        echo "::error::.gungi/devcontainer/devcontainer.json が見つかりません。設定画面のインフラページでセットアップを完了してください。"
        exit 1

    - name: Install devcontainer CLI
      shell: bash
      run: npm install -g @devcontainers/cli@0.85.0

    - name: Build and start Gungi devcontainer
      shell: bash
      run: |
        devcontainer up --workspace-folder "${{ github.workspace }}/repo" \
          --config "${{ github.workspace }}/repo/.gungi/devcontainer/devcontainer.json" \
          --remove-existing-container

    - name: Configure devcontainer workspace
      shell: bash
      run: |
        devcontainer exec --workspace-folder "${{ github.workspace }}/repo" \
          --config "${{ github.workspace }}/repo/.gungi/devcontainer/devcontainer.json" \
          bash -c "git config --global --add safe.directory /workspaces/repo"

    - name: Run Gungi chain
      shell: bash
      run: |
        SECRETS_DIR="${{ github.workspace }}/repo/.gungi/secrets"
        mkdir -p "$SECRETS_DIR"
        grep -qxF '.gungi/secrets/' "${{ github.workspace }}/repo/.gitignore" 2>/dev/null || echo ".gungi/secrets/" >> "${{ github.workspace }}/repo/.gitignore"
        trap "rm -rf $SECRETS_DIR" EXIT

        echo "${{ inputs.github-token }}" > "$SECRETS_DIR/github_token"
        chmod 600 "$SECRETS_DIR/github_token"

        devcontainer exec --workspace-folder "${{ github.workspace }}/repo" \
          --config "${{ github.workspace }}/repo/.gungi/devcontainer/devcontainer.json" \
          --remote-env "AUTH_TOKEN=${{ inputs.auth-token }}" \
          --remote-env "GUNGI_API_URL=https://api.gungi-ai.com" \
          --remote-env "RESUME_REF=${{ inputs.resume-ref }}" \
          --remote-env "GUNGI_WORKSPACE=/workspaces" \
          --remote-env "GITHUB_TOKEN_FILE=/workspaces/repo/.gungi/secrets/github_token" \
          --remote-env "GITHUB_RUN_ID=${{ github.run_id }}" \
          node /app/dist/docker/runner.js

    - name: Report workflow failure
      if: failure()
      shell: bash
      run: |
        curl -sf -X POST "https://api.gungi-ai.com/api/executions/workflow-failed" \
          -H "Content-Type: application/json" \
          -d "{\"auth_token\": \"${{ inputs.auth-token }}\", \"error\": \"Workflow failed (GitHub Actions run ${{ github.run_id }})\"}" \
          || echo "Failed to report workflow failure (auth_token may have been consumed by runner)"

    # 7f. Gungi Docker Runner を実行（devcontainerなしのフォールバックモード）
    # GUNGI_WORKSPACE=/workspace: checkout path: repo によりリポジトリは /workspace/repo に配置。
    # GUNGI_WORKSPACEはその親ディレクトリを指す（.takt/ 等の出力先として使用）。
    - name: Run Gungi chain
      if: steps.devcontainer-check.outputs.found != 'true'
      shell: bash
      run: |
        GUNGI_TMP="${{ github.workspace }}/.gungi-tmp"
        trap "rm -f $GUNGI_TMP/secrets/github_token" EXIT

        mkdir -p "$GUNGI_TMP/secrets"
        echo "${{ inputs.github-token }}" > "$GUNGI_TMP/secrets/github_token"
        chmod 600 "$GUNGI_TMP/secrets/github_token"

        docker run --rm \
          --log-driver none \
          -v "${{ github.workspace }}:/workspace" \
          -v "$GUNGI_TMP/secrets:/tmp/secrets:ro" \
          -e AUTH_TOKEN="${{ inputs.auth-token }}" \
          -e GUNGI_API_URL="https://api.gungi-ai.com" \
          -e RESUME_REF="${{ inputs.resume-ref }}" \
          -e GUNGI_WORKSPACE=/workspace \
          -e GITHUB_TOKEN_FILE=/tmp/secrets/github_token \
          -e GUNGI_IMAGE_DIGEST="${{ steps.digest.outputs.value }}" \
          -e GITHUB_RUN_ID="${{ github.run_id }}" \
          ghcr.io/symon-brain/gungi-runner:latest

    # 8a. シークレットのクリーンアップ（常に実行）
    - name: Cleanup secrets
      if: always()
      shell: bash
      run: |
        find "${{ github.workspace }}/repo/.gungi/secrets" -type f -delete 2>/dev/null || true
        find "${{ github.workspace }}/.gungi-tmp/secrets" -type f -delete 2>/dev/null || true

    # 8b. 結果サマリーを出力
    - name: Output summary
      if: always()
      shell: bash
      run: |
        echo "## Gungi Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
