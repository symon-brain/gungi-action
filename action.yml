name: 'Gungi AI Development'
description: 'AI-driven development automation. Executes phasechains to implement, review, and deliver code changes.'
author: 'Gungi'

branding:
  icon: 'cpu'
  color: 'green'

inputs:
  auth-token:
    description: 'Gungi runner authentication token (created by Gungi API on webhook)'
    required: true
  github-token:
    description: 'GitHub token for repository operations (checkout, branch creation, PR)'
    required: true
  gungi-api-url:
    description: 'Gungi API URL'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}
        path: repo

    - name: Get GHCR token from Gungi API
      id: ghcr-auth
      shell: bash
      run: |
        RESPONSE=$(curl -sf -H "ngrok-skip-browser-warning: true" "${{ inputs.gungi-api-url }}/api/runner/ghcr-token?auth_token=${{ inputs.auth-token }}")
        if [ $? -ne 0 ]; then
          echo "::error::Failed to get GHCR token from Gungi API"
          exit 1
        fi
        TOKEN=$(echo "$RESPONSE" | jq -r '.token')
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "::error::GHCR token is empty"
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      shell: bash
      run: echo "${{ steps.ghcr-auth.outputs.token }}" | docker login ghcr.io -u gungi --password-stdin

    - name: Pull Gungi Runner
      shell: bash
      run: docker pull ghcr.io/symon-brain/gungi-runner:latest

    - name: Get image digest
      id: digest
      shell: bash
      run: echo "value=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/symon-brain/gungi-runner:latest)" >> $GITHUB_OUTPUT

    - name: Run Gungi phasechain
      shell: bash
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -e AUTH_TOKEN="${{ inputs.auth-token }}" \
          -e GUNGI_API_URL="${{ inputs.gungi-api-url }}" \
          -e GUNGI_WORKSPACE=/workspace \
          -e GITHUB_TOKEN="${{ inputs.github-token }}" \
          -e GUNGI_PROVIDER=claude \
          -e GUNGI_IMAGE_DIGEST="${{ steps.digest.outputs.value }}" \
          -e GITHUB_RUN_ID="${{ github.run_id }}" \
          ghcr.io/symon-brain/gungi-runner:latest

    - name: Output summary
      if: always()
      shell: bash
      run: |
        echo "## Gungi Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Auth Token**: [masked]" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
